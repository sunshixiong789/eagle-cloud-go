syntax = "proto3";

package eagle.access.v1;

import "buf/validate/validate.proto";
import "eagle/annotations/v1/perm.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eagle-go/eagle/api/eagle/access/v1;accessv1";

service PermissionService {
  rpc CreatePermission(CreatePermissionRequest) returns (CreatePermissionResponse) {
    option (google.api.http) = {
      post: "/v1/system/permissions"
      body: "*"
    };
    option (eagle.annotations.v1.perm) = "system:permission:add";
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_PERMISSION_REQUIRED;
  }

  rpc GetPermission(GetPermissionRequest) returns (GetPermissionResponse) {
    option (google.api.http) = {get: "/v1/system/permissions/{id}"};
    option (eagle.annotations.v1.perm) = "system:permission:query";
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_PERMISSION_REQUIRED;
  }

  // 平铺返回全部权限，树结构由调用方按 parent_id 拼装
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {get: "/v1/system/permissions"};
    option (eagle.annotations.v1.perm) = "system:permission:list";
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_PERMISSION_REQUIRED;
  }

  rpc UpdatePermission(UpdatePermissionRequest) returns (UpdatePermissionResponse) {
    option (google.api.http) = {
      put: "/v1/system/permissions/{id}"
      body: "*"
    };
    option (eagle.annotations.v1.perm) = "system:permission:edit";
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_PERMISSION_REQUIRED;
  }

  rpc DeletePermission(DeletePermissionRequest) returns (DeletePermissionResponse) {
    option (google.api.http) = {delete: "/v1/system/permissions/{id}"};
    option (eagle.annotations.v1.perm) = "system:permission:remove";
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_PERMISSION_REQUIRED;
  }

  // 当前登录用户的菜单树与权限码，供前端渲染路由和按钮级控制。
  // 只需登录，无需额外权限码——查的就是自己的东西。
  rpc GetMyMenus(GetMyMenusRequest) returns (GetMyMenusResponse) {
    option (google.api.http) = {get: "/v1/system/permissions/me/menus"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }
}

message Permission {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  // 权限码，如 system:user:add。目录/菜单可为空，按钮必填
  string code = 4;
  // 1=目录 2=菜单 3=按钮
  int32 type = 5;
  string path = 6;
  string component = 7;
  string icon = 8;
  int32 sort = 9;
  bool visible = 10;
  int32 status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // 整棵权限树的版本，用于管理端乐观并发控制。
  int64 revision = 14;
}

message CreatePermissionRequest {
  int64 parent_id = 1 [(buf.validate.field).int64.gte = 0];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string code = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[a-zA-Z][a-zA-Z0-9]*(:[a-zA-Z][a-zA-Z0-9]*)+$"
    }
  ];
  int32 type = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3
  }];
  string path = 5 [(buf.validate.field).string.max_len = 255];
  string component = 6 [(buf.validate.field).string.max_len = 255];
  string icon = 7 [(buf.validate.field).string.max_len = 64];
  int32 sort = 8;
  bool visible = 9;
  int32 status = 10 [(buf.validate.field).int32 = {
    in: [
      0,
      1
    ]
  }];
}

message CreatePermissionResponse {
  Permission permission = 1;
}

message GetPermissionRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetPermissionResponse {
  Permission permission = 1;
}

message ListPermissionsRequest {
  optional int32 status = 1 [(buf.validate.field).int32 = {
    in: [
      0,
      1
    ]
  }];
  optional int32 type = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3
  }];
}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message UpdatePermissionRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  int64 parent_id = 2 [(buf.validate.field).int64.gte = 0];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[a-zA-Z][a-zA-Z0-9]*(:[a-zA-Z][a-zA-Z0-9]*)+$"
    }
  ];
  int32 type = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3
  }];
  string path = 6 [(buf.validate.field).string.max_len = 255];
  string component = 7 [(buf.validate.field).string.max_len = 255];
  string icon = 8 [(buf.validate.field).string.max_len = 64];
  int32 sort = 9;
  bool visible = 10;
  int32 status = 11 [(buf.validate.field).int32 = {
    in: [
      0,
      1
    ]
  }];
  optional int64 expected_revision = 12 [(buf.validate.field).int64.gt = 0];
}

message UpdatePermissionResponse {
  Permission permission = 1;
}

message DeletePermissionRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 expected_revision = 2 [(buf.validate.field).int64.gt = 0];
}

message DeletePermissionResponse {}

message GetMyMenusRequest {}

message GetMyMenusResponse {
  // 当前用户可见的目录与菜单（不含按钮），平铺返回
  repeated Permission menus = 1;
  // 当前用户的全部权限码，前端用于按钮级显隐
  repeated string permission_codes = 2;
}
