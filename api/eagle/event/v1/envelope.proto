syntax = "proto3";

package eagle.event.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/eagle-go/eagle/api/eagle/event/v1;eventv1";

// EventEnvelope carries stable delivery metadata independently from an event payload schema.
message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string aggregate_id = 3;
  string aggregate_type = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string producer = 6;
  uint32 schema_version = 7;
  string traceparent = 8;
  bytes payload = 9;
}
