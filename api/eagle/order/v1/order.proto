syntax = "proto3";

package eagle.order.v1;

import "buf/validate/validate.proto";
import "eagle/annotations/v1/perm.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eagle-go/eagle/api/eagle/order/v1;orderv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {post: "/v1/orders" body: "*"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }
  rpc GetMyOrder(GetMyOrderRequest) returns (GetMyOrderResponse) {
    option (google.api.http) = {get: "/v1/orders/{id}"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListMyOrdersResponse) {
    option (google.api.http) = {get: "/v1/orders"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
}

message OrderItem {
  int64 product_id = 1;
  string product_sku = 2;
  string product_name = 3;
  int64 unit_price_cents = 4;
  int32 quantity = 5;
  int64 subtotal_cents = 6;
}

message Order {
  string id = 1;
  OrderStatus status = 2;
  int64 total_cents = 3;
  repeated OrderItem items = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateOrderItem {
  int64 product_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 quantity = 2 [(buf.validate.field).int32 = {gt: 0 lte: 999}];
}
message CreateOrderRequest {
  repeated CreateOrderItem items = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
  string idempotency_key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message CreateOrderResponse { Order order = 1; }

message GetMyOrderRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetMyOrderResponse { Order order = 1; }

message ListMyOrdersRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0 lte: 200}];
}
message ListMyOrdersResponse {
  repeated Order orders = 1;
  int64 total = 2;
}
