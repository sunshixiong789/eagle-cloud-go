syntax = "proto3";

package eagle.notification.v1;

import "buf/validate/validate.proto";
import "eagle/annotations/v1/perm.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eagle-go/eagle/api/eagle/notification/v1;notificationv1";

// NotificationService is the in-app notification boundary. External email,
// SMS, and push delivery are intentionally not part of the foundation yet.
service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse) {
    option (google.api.http) = {
      post: "/v1/system/notifications"
      body: "*"
    };
    option (eagle.annotations.v1.perm) = "system:notification:send";
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_PERMISSION_REQUIRED;
  }

  rpc ListMyNotifications(ListMyNotificationsRequest) returns (ListMyNotificationsResponse) {
    option (google.api.http) = {get: "/v1/system/notifications"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }

  rpc GetMyUnreadCount(GetMyUnreadCountRequest) returns (GetMyUnreadCountResponse) {
    option (google.api.http) = {get: "/v1/system/notifications/unread-count"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }

  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse) {
    option (google.api.http) = {put: "/v1/system/notifications/{id}:read"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }

  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse) {
    option (google.api.http) = {put: "/v1/system/notifications:read-all"};
    option (eagle.annotations.v1.access) = ACCESS_LEVEL_AUTHENTICATED;
  }
}

message Notification {
  int64 id = 1;
  string title = 2;
  string content = 3;
  string sender_subject = 4;
  google.protobuf.Timestamp read_at = 5;
  google.protobuf.Timestamp created_at = 6;
}

message SendNotificationRequest {
  string recipient_subject = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string content = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

message SendNotificationResponse {
  Notification notification = 1;
}

message ListMyNotificationsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  bool unread_only = 3;
}

message ListMyNotificationsResponse {
  repeated Notification notifications = 1;
  int64 total = 2;
}

message GetMyUnreadCountRequest {}

message GetMyUnreadCountResponse {
  int64 count = 1;
}

message MarkNotificationReadRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message MarkNotificationReadResponse {
  Notification notification = 1;
}

message MarkAllNotificationsReadRequest {}

message MarkAllNotificationsReadResponse {
  int64 updated = 1;
}
