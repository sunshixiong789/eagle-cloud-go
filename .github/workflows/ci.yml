name: CI
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-alpine
        env:
          RABBITMQ_DEFAULT_USER: eagle_ci
          RABBITMQ_DEFAULT_PASS: eagle_ci_test
        ports: ['5672:5672']
        options: --health-cmd 'rabbitmq-diagnostics -q ping' --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EAGLE_TEST_REDIS_ADDRESS: 127.0.0.1:6379
      EAGLE_TEST_RABBITMQ_URL: amqp://eagle_ci:eagle_ci_test@127.0.0.1:5672/
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Check generated sources and module manifests
        run: |
          make generate
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Check API compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${BASE_SHA:-origin/$DEFAULT_BRANCH}"
          make lint-proto BUF_AGAINST=".git#ref=$base,subdir=api"
      - run: make lint
      - name: Race, real adapters, migration round trips and architecture
        run: make test
      - run: make build
      - run: make build-independent
      - run: make validate-deploy
      - run: make test-gateway
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        service: [admin, product, order]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
