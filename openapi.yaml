tags:
    - name: DictService
      description: |-
        DictService 管理数据字典。字典类型（sys_common_status）下挂若干字典项，
         前端下拉框、状态标签统一从这里取，避免枚举值散落在各处代码里。
    - name: FileService
      description: |-
        FileService provides the small-file workflow used by the foundation. HTTP
         uploads and downloads use raw bodies rather than JSON/base64 encoding.
    - name: NotificationService
      description: |-
        NotificationService is the in-app notification boundary. External email,
         SMS, and push delivery are intentionally not part of the foundation yet.
    - name: OrderService
    - name: PermissionService
    - name: ProductService
    - name: RoleBindingService
      description: |-
        RoleBindingService 管理「角色 → 权限码」的映射，即 Casbin 的 p 策略。

         角色本身不在这里创建或删除——它由 Keycloak 维护，随 token 的
         realm_access.roles 下发。本服务只回答「这个角色能调哪些接口」。

         这样切分的原因：把用户到角色的归属也放进本库，就等于与 Keycloak
         双写同一份数据，必然漂移；而把权限映射放进 Keycloak，则每次
         授权判定都要跨网络调用，且权限配置只能在 Keycloak 后台改。
