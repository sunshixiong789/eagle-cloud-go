global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 指标端口独立于业务端口，不经过认证鉴权中间件；生产环境只应在
  # 集群内部开放，并由 NetworkPolicy 限制为 Prometheus 可达。
  - job_name: eagle-services
    metrics_path: /metrics
    static_configs:
      - targets: ["admin:9100"]
        labels: {service_name: admin}
      - targets: ["product:9100"]
        labels: {service_name: product}
      - targets: ["order:9100"]
        labels: {service_name: order}
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
