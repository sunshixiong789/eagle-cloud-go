# Docker 自定义网络的内置 DNS；容器重建后更新地址，不缓存启动时的 IP。
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream admin_backend {
  zone admin_backend 64k;
  server admin:8000 resolve;
  keepalive 16;
}

upstream product_backend {
  zone product_backend 64k;
  server product:8000 resolve;
  keepalive 16;
}

upstream order_backend {
  zone order_backend 64k;
  server order:8000 resolve;
  keepalive 16;
}
