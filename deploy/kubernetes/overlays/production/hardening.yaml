apiVersion: v1
kind: ResourceQuota
metadata: {name: eagle-runtime-quota}
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "40"
    limits.memory: 64Gi
    pods: "80"
---
apiVersion: v1
kind: LimitRange
metadata: {name: eagle-container-defaults}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "1", memory: 512Mi}
      max: {cpu: "4", memory: 4Gi}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: eagle-service}
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Eagle online service priority; stateful platform components use separate classes.
