  name: eagle-runtime
  namespace: eagle
type: Opaque
stringData:
  admin-database-dsn: CHANGE_ME
  product-database-dsn: CHANGE_ME
  order-database-dsn: CHANGE_ME
  product-service-auth-client-secret: CHANGE_ME
  order-service-auth-client-secret: CHANGE_ME
  rabbitmq-url: CHANGE_ME
