apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: eagle-services
spec:
  namespaceSelector:
    matchNames: [eagle]
  selector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [admin, product, order]}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          targetLabel: service_name
