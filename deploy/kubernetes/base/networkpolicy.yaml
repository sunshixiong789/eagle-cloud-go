apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-gateway-http}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: eagle}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {eagle.io/gateway-access: "true"}}}]
      ports: [{port: 8000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-product-to-admin-grpc}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: admin}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: product}}}]
      ports: [{port: 9000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-order-to-product-grpc}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: product}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: order}}}]
      ports: [{port: 9000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-observability-metrics}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: eagle}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {eagle.io/observability-access: "true"}}}]
      ports: [{port: 9100, protocol: TCP}]
