apiVersion: v1
kind: Service
metadata: {name: admin, labels: {app.kubernetes.io/name: admin}}
spec:
  selector: {app.kubernetes.io/name: admin}
  ports: [{name: http, port: 8000, targetPort: http}, {name: grpc, port: 9000, targetPort: grpc}, {name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: v1
kind: Service
metadata: {name: admin-grpc, labels: {app.kubernetes.io/name: admin}}
spec:
  # gRPC 使用长连接。Headless Service 让 DNS 返回全部就绪 Pod，交给
  # Kratos gRPC 客户端内置的 wrr balancer 做请求级负载均衡。
  clusterIP: None
  selector: {app.kubernetes.io/name: admin}
  ports:
    - {name: grpc, port: 9000, targetPort: grpc, appProtocol: kubernetes.io/h2c}
---
apiVersion: v1
kind: Service
metadata: {name: product, labels: {app.kubernetes.io/name: product}}
spec:
  selector: {app.kubernetes.io/name: product}
  ports: [{name: http, port: 8000, targetPort: http}, {name: grpc, port: 9000, targetPort: grpc}, {name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: v1
kind: Service
metadata: {name: product-grpc, labels: {app.kubernetes.io/name: product}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: product}
  ports:
    - {name: grpc, port: 9000, targetPort: grpc, appProtocol: kubernetes.io/h2c}
---
apiVersion: v1
kind: Service
metadata: {name: order, labels: {app.kubernetes.io/name: order}}
spec:
  selector: {app.kubernetes.io/name: order}
  ports: [{name: http, port: 8000, targetPort: http}, {name: grpc, port: 9000, targetPort: grpc}, {name: metrics, port: 9100, targetPort: metrics}]
