apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: admin}}
  template:
    metadata: {labels: {app.kubernetes.io/name: admin, app.kubernetes.io/part-of: eagle}}
    spec:
      serviceAccountName: eagle-admin
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: admin}}}
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: admin}}}
      containers:
        - name: admin
          image: registry.example.com/eagle/admin:dev
          args: ["-conf", "/app/configs"]
          envFrom: [{configMapRef: {name: eagle-runtime}}]
          env:
            - {name: EAGLE_DATABASE_DSN, valueFrom: {secretKeyRef: {name: eagle-runtime, key: admin-database-dsn}}}
            - {name: EAGLE_AUTH_CLIENT_ID, value: eagle-admin}
            - {name: EAGLE_AUTH_AUDIENCE, value: eagle-admin}
            - {name: EAGLE_AUTH_INTERNAL_CLIENT_ID, value: eagle-product-worker}
            - {name: EAGLE_MESSAGING_RABBITMQ_URL, valueFrom: {secretKeyRef: {name: eagle-runtime, key: rabbitmq-url}}}
            - {name: EAGLE_FILE_S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: eagle-runtime, key: s3-access-key}}}
            - {name: EAGLE_FILE_S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: eagle-runtime, key: s3-secret-key}}}
          ports: [{name: http, containerPort: 8000}, {name: grpc, containerPort: 9000}, {name: metrics, containerPort: 9100}]
          startupProbe: {httpGet: {path: /readyz, port: metrics}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /livez, port: metrics}, periodSeconds: 10, timeoutSeconds: 2}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}}
---
