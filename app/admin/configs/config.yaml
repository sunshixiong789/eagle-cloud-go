# eagle 后端服务本地开发配置。
#
# 生产环境不要直接改这个文件：敏感项（如 DSN 口令）应经由
# 环境变量或 K8s Secret 注入，本文件只保留结构和安全的默认值。
#
# 【时长字段的写法】
# 所有 duration 都由 google.protobuf.Duration 承载，它只接受
# 「秒数 + s」这一种格式：3600s、0.5s。
# Go 风格的 1h / 30m / 500ms 一律解析失败，且会让服务在启动阶段
# 直接崩溃（见 config_test.go 中的回归测试）。

server:
  http:
    addr: "${SERVER_HTTP_ADDR:0.0.0.0:8001}"
    timeout: 5s
  grpc:
    addr: "${SERVER_GRPC_ADDR:0.0.0.0:9001}"
    timeout: 5s

data:
  database:
    dsn: "${DATABASE_DSN:postgres://eagle:eagle@127.0.0.1:5432/eagle_admin?sslmode=disable}"
    max_conns: 20
    max_idle_conns: 2
    max_conn_lifetime: 3600s
    max_conn_idle_time: 1800s

auth:
  # Keycloak realm 的 issuer，必须与 token 里的 iss 完全一致
  # （含协议、端口、是否带尾斜杠）。不一致时所有 token 都会因
  # iss 校验失败被拒，而报错信息不易定位到这里。
  issuer: "${AUTH_ISSUER:http://127.0.0.1:8080/realms/eagle}"

  # 本服务在 Keycloak 中的 client id，
  # 用于从 token 的 resource_access 取本服务的 client 角色
  client_id: "${AUTH_CLIENT_ID:eagle-admin}"

  # 期望的 aud。Keycloak 默认把 aud 设成 "account"，需要在客户端上
  # 配 audience mapper（见 deploy/keycloak/realm-eagle.json）才有意义。
  # 留空则不校验 aud。
  audience: "${AUTH_AUDIENCE:eagle-admin}"

  # 内外网地址不同时通过 EAGLE_AUTH_JWKS_URL 覆盖。
  jwks_url: "${AUTH_JWKS_URL:}"

  # 仅本服务 client role（resource_access.eagle-admin.roles）会触发短路；
  # 同名 realm role 不具备跨服务超管能力。
  super_admin_role: admin
  internal_client_ids: ["${AUTH_INTERNAL_CLIENT_ID:eagle-worker}"]

file:
  provider: "${FILE_PROVIDER:local}"
  local_dir: "${FILE_LOCAL_DIR:/tmp/eagle-go/uploads}"
  max_size_bytes: 10485760
  s3:
    endpoint: "${FILE_S3_ENDPOINT:127.0.0.1:9004}"
    region: "${FILE_S3_REGION:us-east-1}"
    bucket: "${FILE_S3_BUCKET:eagle-files}"
    access_key: "${FILE_S3_ACCESS_KEY:eagle}"
    secret_key: "${FILE_S3_SECRET_KEY:eagle-local-secret}"
    use_ssl: "${FILE_S3_USE_SSL:false}"

messaging:
  rabbitmq:
    enabled: true
    url: "${MESSAGING_RABBITMQ_URL:amqp://eagle:eagle@127.0.0.1:5672/}"
    exchange: eagle.events
    order_created_queue: eagle.admin.order-created.v1
    reconnect_backoff: 2s
    consumer_max_attempts: 5
    consumer_retry_backoff: 1s

observability:
  # 指向本地 obs profile 里的 OTel Collector。
  #
  # 默认就填上而不是留空：留空会让「启动了 obs 栈却看不到链路」成为
  # 一个需要翻文档才能解开的坑。collector 不在时导出器只在后台静默重试，
  # 实测服务照常启动、接口照常响应、日志零噪音，因此填着没有副作用。
  # 完全不想上报时置空即可。
  otlp_endpoint: "${OBSERVABILITY_OTLP_ENDPOINT:127.0.0.1:4317}"
  otlp_insecure: "${OBSERVABILITY_OTLP_INSECURE:true}"
  # 开发期全采样；生产建议降到 0.01~0.1
  trace_sample_ratio: "${OBSERVABILITY_TRACE_SAMPLE_RATIO:1.0}"
  log_level: "${OBSERVABILITY_LOG_LEVEL:info}"
  # 指标与健康检查端点，独立于业务端口且不经过鉴权
  metrics_addr: "${OBSERVABILITY_METRICS_ADDR:0.0.0.0:9101}"
